<style>
:root{
  --paper:#F1EEE2;
  --paper-dark:#E7E1CE;
  --ink:#26344B;
  --ink-soft:#5B6473;
  --rule:#B9AE8C;
  --rule-soft:#D9D2B8;
  --hanko:#B3312C;
  --hanko-soft:#E3C7C2;
  --forest:#3F6B4A;
  --card:#FBF9F2;
  --shadow: 0 2px 10px rgba(38,52,75,0.12);
  --tab-1:#6B8F71;
  --tab-2:#52708A;
  --tab-3:#B8863B;
  --tab-4:#7B5470;
  --tab-5:#3F7D7A;
  --tab-6:#B4623C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:15px;
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(185,174,140,0.16) 28px);
}
button, .chip, .tab, .dot, .checkbtn, .addbtn, .stepper button, .navbtn{
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}
input, textarea{
  -webkit-user-select:text;
  user-select:text;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}
/* iOS Safariは16px未満の入力欄にフォーカスすると自動でズームするため、
   フォーカス時だけ16pxにして見た目を崩さずズームを防ぐ(iOSのみ作動) */
@supports (-webkit-touch-callout: none){
  input:focus, textarea:focus, select:focus{ font-size:16px; }
}

/* ---------- HEADER ---------- */
#topbar{
  flex:0 0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 70px 10px 16px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom:2px solid var(--ink);
  background:var(--paper);
  position:relative;
  z-index:21;
}
#topbar .titles{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
#schoolName{
  font-family:'Shippori Mincho',serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:0.02em;
  border:none;
  border-bottom:1.5px dashed transparent;
  background:transparent;
  color:var(--ink);
  padding:2px 3px;
  min-width:64px;
  max-width:44vw;
  font-family:'Shippori Mincho',serif;
}
#schoolName:focus{outline:none; border-bottom-color:var(--hanko); background:rgba(255,255,255,0.55);}
#schoolName::placeholder{color:var(--ink-soft); opacity:0.6;}
#pageKind{
  font-family:'Shippori Mincho',serif;
  font-size:17px;
  color:var(--ink-soft);
}
#contactInfo{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:2px;
}
.contact-input{
  font-size:11px;
  color:var(--ink-soft);
  text-align:right;
  line-height:1.4;
  border:none;
  border-bottom:1px dashed transparent;
  background:transparent;
  width:118px;
  padding:1px 2px;
  font-family:inherit;
}
.contact-input:focus{outline:none; border-bottom-color:var(--hanko); background:rgba(255,255,255,0.5);}
.contact-input::placeholder{color:#B5AD98;}

/* ---------- TAB RAIL (signature element) ---------- */
#tabRail{
  position:fixed;
  top:0; right:env(safe-area-inset-right); bottom:0;
  width:64px;
  z-index:20;
  overflow-y:auto;
  overflow-x:visible;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:none;
  display:flex;
  flex-direction:column;
  padding-top:70px;
  pointer-events:none;
}
#tabRail::-webkit-scrollbar{display:none;}
.tab{
  pointer-events:auto;
  position:relative;
  margin:1px 0 1px auto;
  padding:7px 5px;
  width:56px;
  min-height:34px;
  border-radius:6px 0 0 6px;
  color:#fff;
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-weight:700;
  font-size:11px;
  line-height:1.3;
  letter-spacing:0.01em;
  text-align:center;
  white-space:normal;
  word-break:keep-all;
  overflow-wrap:anywhere;
  box-shadow:-1px 2px 4px rgba(0,0,0,0.18);
  transition:width 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tab.active{
  width:70px;
  transform:translateX(-6px);
  box-shadow:-2px 3px 8px rgba(0,0,0,0.28);
  outline:2px solid var(--paper);
  outline-offset:-4px;
}
.tab:focus-visible{outline:3px solid var(--hanko);}

.tab-add{
  pointer-events:auto;
  margin:8px 0 16px auto;
  width:56px;height:40px;
  border-radius:6px 0 0 6px;
  border:1.5px dashed var(--rule);
  background:var(--paper-dark);
  color:var(--ink-soft);
  font-size:20px;
  font-weight:700;
  font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:-1px 2px 4px rgba(0,0,0,0.1);
}
.tab-add:active{background:var(--rule-soft);}

/* ---------- MAIN SCROLL AREA ---------- */
#viewport{
  flex:1 1 auto;
  overflow:hidden;
  position:relative;
  margin-right:calc(64px + env(safe-area-inset-right));
}
#pageTrack{
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  padding:14px calc(14px + env(safe-area-inset-right)) 90px 16px;
}
.fade-enter{animation:pageFade 0.22s ease;}
@keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- SECTION CARD ---------- */
.section{
  background:var(--card);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  padding:12px 14px 14px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.section h2{
  font-family:'Shippori Mincho',serif;
  font-size:15px;
  margin:0 0 10px 0;
  padding-bottom:6px;
  border-bottom:1.5px solid var(--rule);
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
}
.section h2 .eyebrow{
  font-size:10px;
  font-weight:700;
  color:#fff;
  background:var(--ink);
  padding:2px 7px;
  border-radius:3px;
  font-family:'Zen Kaku Gothic New',sans-serif;
  letter-spacing:0.05em;
}
.teacherInput{
  margin-left:auto;
  border:1px solid var(--rule);
  border-radius:5px;
  background:#fff;
  padding:4px 8px;
  font-size:12.5px;
  font-weight:500;
  font-family:'Zen Kaku Gothic New',sans-serif;
  color:var(--ink);
  width:110px;
}
.teacherInput::placeholder{color:#B5AD98;}
.subhead{
  font-size:12px;
  color:var(--hanko);
  font-weight:700;
  margin:14px 0 6px;
  padding-left:2px;
  border-left:3px solid var(--hanko);
  padding-left:6px;
}

/* ---------- SUBJECT ITEM ---------- */
.item{
  padding:9px 2px;
  border-bottom:1px dashed var(--rule-soft);
}
.item:last-child{border-bottom:none;}
.item-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  margin-bottom:4px;
}
.item-name{font-weight:700;font-size:14.5px;}
.item-name.empty{color:var(--ink-soft);font-weight:500;font-style:italic;}
.item-price{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums;}
.chiprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0;}
.yearlabel-input{
  font-size:10.5px;color:#fff;background:var(--ink-soft);
  width:30px;flex:0 0 auto;font-weight:700;
  border:none;border-radius:4px;
  text-align:center;padding:6px 2px;
  font-family:'Zen Kaku Gothic New',sans-serif;
}
.yearlabel-input:focus{outline:2px solid var(--hanko);}
.chip{
  position:relative;
  padding:4px 11px;
  font-size:13.5px;
  border-radius:5px;
  background:transparent;
  border:1px solid transparent;
  cursor:pointer;
  font-family:'Zen Kaku Gothic New',sans-serif;
  color:var(--ink);
  user-select:none;
  min-height:30px;
  display:inline-flex;
  align-items:center;
}
.chip:active{background:rgba(38,52,75,0.06);}
.chip .ring{
  position:absolute;
  inset:-3px -7px;
  border:2.5px solid var(--hanko);
  border-radius:50% 44% 56% 48% / 58% 46% 62% 42%;
  transform:rotate(-4deg);
  opacity:0;
  pointer-events:none;
}
.chip.on{color:var(--hanko);font-weight:700;}
.chip.on .ring{opacity:1;}

/* ---------- 上下まとめ判子（長押しで結合） ---------- */
.chippair{
  position:relative;
  display:inline-flex;
  align-items:center;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
.chippair .pairring{
  position:absolute;
  inset:-4px -6px;
  border:2.5px solid var(--hanko);
  border-radius:48% 52% 46% 54% / 68% 60% 72% 56%;
  transform:rotate(-2deg);
  opacity:0;
  pointer-events:none;
  transition:opacity 0.12s ease;
}
.chippair.paired .pairring{opacity:1;}
.chippair.paired .chip{color:var(--hanko);font-weight:700;}
.item-fields{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.field-mini{display:flex;align-items:center;gap:4px;}
.field-mini label{font-size:10.5px;color:var(--ink-soft);}
.field-mini input{
  border:1px solid var(--rule);
  border-radius:5px;
  background:#fff;
  padding:5px 6px;
  font-size:12.5px;
  font-family:inherit;
  color:var(--ink);
  width:78px;
}
.field-mini input[type=number]{width:54px;}
.datebox{position:relative; display:inline-flex; align-items:center;}
.datebox .date-native{
  position:absolute; inset:0; opacity:0; width:100%; height:100%;
  cursor:pointer; z-index:2; font-size:16px; margin:0; padding:0; border:none;
}
.datebox .date-label{
  pointer-events:none;
  border:1px solid var(--rule);
  border-radius:5px;
  background:#fff;
  padding:5px 10px;
  font-size:12.5px;
  color:var(--ink);
  min-width:46px;
  text-align:center;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.datebox .date-label.empty{color:#B5AD98;}

/* ---------- CLASS TABLE ---------- */
.classgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.classcell{
  background:#fff;
  border:1px solid var(--rule-soft);
  border-radius:7px;
  padding:6px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
}
.classcell .clabel{font-size:11px;color:var(--ink-soft);font-weight:700;}
.classcell input{
  width:40px;
  border:none;
  border-bottom:1.5px solid var(--rule);
  background:transparent;
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:var(--ink);
  padding:2px 0;
}
.classtotal{margin-top:8px;font-size:12px;color:var(--ink-soft);text-align:right;}
.classtotal b{color:var(--ink);font-size:14px;}

/* ---------- CHECK ROW ---------- */
.checkrow{display:flex;gap:10px;flex-wrap:wrap;}
.checkbtn{
  flex:1 1 0;
  min-width:88px;
  text-align:center;
  padding:12px 6px;
  border-radius:8px;
  border:1.5px solid var(--rule);
  background:#fff;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  color:var(--ink-soft);
  transition:background 0.12s, color 0.12s, border-color 0.12s;
}
.checkbtn.on{background:var(--forest);border-color:var(--forest);color:#fff;}

/* ---------- DYNAMIC LIST (return books / memo) ---------- */
.dyn-row{
  background:#fff;
  border:1px solid var(--rule-soft);
  border-radius:8px;
  padding:9px 10px;
  margin-bottom:8px;
  position:relative;
}
.dyn-row .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
.dyn-row input, .dyn-row textarea{
  width:100%;
  border:none;
  border-bottom:1.3px solid var(--rule-soft);
  background:transparent;
  font-family:inherit;
  font-size:13px;
  padding:4px 2px;
  color:var(--ink);
}
.dyn-row textarea{resize:vertical;min-height:36px;border-bottom:none;background:#FAF8EF;border-radius:5px;padding:6px 8px;border:1px solid var(--rule-soft);}
.dyn-row input::placeholder,.dyn-row textarea::placeholder{color:#B5AD98;}
.delrow{
  position:absolute; top:6px; right:6px;
  width:22px;height:22px;border-radius:50%;
  background:var(--paper-dark); color:var(--ink-soft);
  border:none; font-size:13px; line-height:1; cursor:pointer;
}
.addbtn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1.5px dashed var(--rule);
  background:transparent;
  color:var(--ink-soft);
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
}
.addbtn:active{background:var(--paper-dark);}
.empty-hint{font-size:12px;color:var(--ink-soft);padding:6px 2px 10px;}

/* ---------- MEMO PAGE ---------- */
.memopage-hero{
  font-family:'Shippori Mincho',serif;
  font-size:20px;
  margin:4px 0 14px;
  display:flex;
  align-items:center;
  gap:10px;
}
.memopage-hero .stamp{
  display:inline-block;
  border:2.5px solid var(--hanko);
  color:var(--hanko);
  border-radius:50% 44% 56% 48% / 58% 46% 62% 42%;
  transform:rotate(-4deg);
  padding:3px 10px;
  font-size:13px;
  font-weight:700;
}

/* ---------- BOTTOM NAV ---------- */
#bottomnav{
  position:fixed;
  left:env(safe-area-inset-left); right:calc(64px + env(safe-area-inset-right)); bottom:0;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, var(--paper) 60%, rgba(241,238,226,0));
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  z-index:15;
  pointer-events:none;
}
#bottomnav .navbtn{
  pointer-events:auto;
  background:var(--ink);
  color:#fff;
  border:none;
  width:38px;height:38px;
  border-radius:50%;
  font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  flex:0 0 auto;
}
#dots{
  pointer-events:auto;
  display:flex;
  gap:5px;
  background:var(--card);
  border:1px solid var(--rule-soft);
  border-radius:20px;
  padding:6px 10px;
  box-shadow:var(--shadow);
  overflow-x:auto;
  max-width:calc(100vw - 180px);
}
.dot{
  flex:0 0 auto;
  width:26px;height:26px;
  border-radius:50%;
  border:1.5px solid var(--rule);
  background:#fff;
  font-size:11px;
  font-weight:700;
  color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.dot.active{background:var(--hanko);border-color:var(--hanko);color:#fff;}
.dot.memo{font-size:13px;}

/* swipe hint arrows */
.edgehint{
  position:absolute; top:50%; transform:translateY(-50%);
  color:var(--rule); font-size:22px; opacity:0.5; pointer-events:none;
}
.edgehint.left{left:2px;} .edgehint.right{right:2px;}

/* ---------- SCHOOL SEARCH ---------- */
#searchBtn{
  flex:0 0 auto;
  width:34px;height:34px;
  border-radius:50%;
  border:1.5px solid var(--rule);
  background:var(--card);
  color:var(--ink);
  font-size:15px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  margin-left:8px;
}
#portalBtn{
  flex:0 0 auto;
  width:34px;height:34px;
  border-radius:50%;
  border:1.5px solid var(--rule);
  background:var(--card);
  color:var(--ink);
  font-size:15px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  margin-left:6px;
  text-decoration:none;
}
#portalBtn:active{background:var(--paper-dark);}
#deleteSchoolBtn{
  flex:0 0 auto;
  width:34px;height:34px;
  border-radius:50%;
  border:1.5px solid var(--hanko-soft);
  background:var(--card);
  color:var(--hanko);
  font-size:14px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  margin-left:6px;
}
#deleteSchoolBtn:active{background:var(--hanko-soft);}
#searchOverlay{
  position:fixed; inset:0;
  background:rgba(38,52,75,0.34);
  z-index:40;
  display:none;
  padding:12vh 16px 0;
}
#searchOverlay.open{display:block;}
#searchPanel{
  background:var(--paper);
  border-radius:12px;
  max-width:440px;
  margin:0 auto;
  max-height:70vh;
  display:flex;
  flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  overflow:hidden;
  border:1px solid var(--rule-soft);
}
#searchInputRow{
  display:flex; align-items:center; gap:8px;
  padding:12px;
  border-bottom:1.5px solid var(--ink);
}
#searchInputRow input{
  flex:1;
  border:1px solid var(--rule);
  border-radius:8px;
  padding:9px 10px;
  font-size:15px;
  font-family:inherit;
  background:#fff;
  color:var(--ink);
}
#searchCloseBtn{
  flex:0 0 auto;
  background:none;border:none;
  font-size:20px;color:var(--ink-soft);
  cursor:pointer; padding:2px 4px;
}
#searchResults{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.searchResultRow{
  display:flex; align-items:center; gap:10px;
  padding:11px 14px;
  border-bottom:1px dashed var(--rule-soft);
  cursor:pointer;
}
.searchResultRow:active{background:var(--paper-dark);}
.searchResultRow .swatch{
  width:12px;height:12px;border-radius:50%;flex:0 0 auto;
}
.searchResultRow .srname{font-weight:700;font-size:14px;flex:1;}
.searchResultRow .srbadge{
  font-size:10px;color:var(--forest);font-weight:700;
  border:1px solid var(--forest);border-radius:4px;padding:1px 5px;
}
.srColorBtn{
  flex:0 0 auto;
  width:28px;height:28px;
  border-radius:50%;
  border:1px solid var(--rule);
  background:#fff;
  font-size:13px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.srColorBtn:active{background:var(--paper-dark);}
.searchEmpty{padding:16px;text-align:center;color:var(--ink-soft);font-size:13px;}

/* ---------- CONFIRM MODAL ---------- */
#confirmOverlay{
  position:fixed; inset:0;
  background:rgba(38,52,75,0.4);
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  padding:0 24px;
}
#confirmOverlay.open{display:flex;}
#confirmPanel{
  background:var(--paper);
  border-radius:14px;
  max-width:340px;
  width:100%;
  padding:20px 18px 16px;
  box-shadow:0 10px 34px rgba(0,0,0,0.32);
  border:1px solid var(--rule-soft);
}
#confirmMessage{
  font-size:14px;
  line-height:1.6;
  color:var(--ink);
  white-space:pre-wrap;
  margin-bottom:18px;
}
#confirmButtons{
  display:flex;
  gap:8px;
}
#confirmButtons button{
  flex:1;
  padding:11px 8px;
  border-radius:8px;
  font-size:13.5px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  border:1.5px solid var(--rule);
  background:#fff;
  color:var(--ink-soft);
}
#confirmOkBtn{
  border-color:var(--hanko);
  background:var(--hanko);
  color:#fff;
}
#confirmOkBtn:active{opacity:0.85;}
#confirmCancelBtn:active{background:var(--paper-dark);}

/* ---------- ARCHIVE BANNER ---------- */
#archiveBanner{
  display:none;
  flex:0 0 auto;
  background:#F3E6C8;
  color:#7A5A1E;
  font-size:12px;
  font-weight:700;
  text-align:center;
  padding:7px 10px;
  border-bottom:1px solid #D9C48F;
}
body.archive-mode #archiveBanner{display:block;}
body.archive-mode #deleteSchoolBtn,
body.archive-mode #exportArchiveBtn{display:none;}
body.archive-mode input:disabled,
body.archive-mode textarea:disabled{
  opacity:1;
  color:var(--ink);
  -webkit-text-fill-color:var(--ink);
}

/* ---------- EXPORT ARCHIVE BUTTON ---------- */
#exportArchiveBtn{
  display:block;
  width:calc(100% - 24px);
  margin:10px 12px 12px;
  padding:11px;
  border-radius:8px;
  border:1.5px dashed var(--rule);
  background:transparent;
  color:var(--ink-soft);
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
}
#exportArchiveBtn:active{background:var(--paper-dark);}
#driveSaveBtn, #driveConfigBtn{
  display:block;
  width:calc(100% - 24px);
  margin:10px 12px 12px;
  padding:11px;
  border-radius:8px;
  border:1.5px dashed var(--rule);
  background:transparent;
  color:var(--ink-soft);
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
}
#driveSaveBtn:active, #driveConfigBtn:active{background:var(--paper-dark);}
body.archive-mode #driveSaveBtn, body.archive-mode #driveConfigBtn{display:none;}

#driveConfigOverlay{
  position:fixed; inset:0;
  background:rgba(38,52,75,0.4);
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  padding:0 24px;
}
#driveConfigOverlay.open{display:flex;}
#driveConfigPanel{
  background:var(--paper);
  border-radius:14px;
  max-width:360px;
  width:100%;
  padding:20px 18px 16px;
  box-shadow:0 10px 34px rgba(0,0,0,0.32);
  border:1px solid var(--rule-soft);
}
#driveConfigMessage{font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:12px;}
#driveConfigUrlInput, #driveConfigTokenInput{
  width:100%;
  border:1px solid var(--rule);
  border-radius:8px;
  padding:9px 10px;
  font-size:13px;
  font-family:inherit;
  background:#fff;
  color:var(--ink);
  margin-bottom:10px;
  box-sizing:border-box;
}
#driveConfigButtons{display:flex;gap:8px;}
#driveConfigButtons button{
  flex:1;
  padding:11px 8px;
  border-radius:8px;
  font-size:13.5px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  border:1.5px solid var(--rule);
  background:#fff;
  color:var(--ink-soft);
}
#driveConfigSaveBtn{border-color:var(--forest);background:var(--forest);color:#fff;}
#driveConfigSaveBtn:active{opacity:0.85;}
#driveConfigCancelBtn:active{background:var(--paper-dark);}

/* ---------- ARCHIVE YEAR DIALOG ---------- */
#archiveOverlay{
  position:fixed; inset:0;
  background:rgba(38,52,75,0.4);
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  padding:0 24px;
}
#archiveOverlay.open{display:flex;}
#archivePanel{
  background:var(--paper);
  border-radius:14px;
  max-width:340px;
  width:100%;
  padding:20px 18px 16px;
  box-shadow:0 10px 34px rgba(0,0,0,0.32);
  border:1px solid var(--rule-soft);
}
#archiveMessage{
  font-size:13px;
  line-height:1.6;
  color:var(--ink);
  margin-bottom:14px;
}
#archiveYearInput{
  width:100%;
  border:1px solid var(--rule);
  border-radius:8px;
  padding:10px 12px;
  font-size:15px;
  font-family:inherit;

  display:none;

.dot.has-data::after{
  content:'';

::-webkit-scrollbar{width:0;height:0;}
</style>

<script>
(function(){
'use strict';

const SCHOOLS = JSON.parse(document.getElementById('data-schools').textContent);
const GRADES = JSON.parse(document.getElementById('data-grades').textContent); // index 0..5 => grade1..6

// ---- 閲覧専用アーカイブ判定 ----
// data-archive タグに実データが埋め込まれていれば、このファイルは
// 「書き出し済みアーカイブ」として起動し、一切の編集・保存を行わない。
const ARCHIVE_RAW = (document.getElementById('data-archive').textContent || '').trim();
const ARCHIVE_DATA = (ARCHIVE_RAW && ARCHIVE_RAW !== 'null') ? JSON.parse(ARCHIVE_RAW) : null;
const ARCHIVE_MODE = !!ARCHIVE_DATA;

const TAB_COLORS = ['var(--tab-1)','var(--tab-2)','var(--tab-3)','var(--tab-4)','var(--tab-5)','var(--tab-6)'];
const COLOR_PALETTE = [
  {color:'#6B8F71', textColor:'#FFFFFF'},
  {color:'#52708A', textColor:'#FFFFFF'},
  {color:'#B8863B', textColor:'#FFFFFF'},
  {color:'#7B5470', textColor:'#FFFFFF'},
  {color:'#3F7D7A', textColor:'#FFFFFF'},
  {color:'#B4623C', textColor:'#FFFFFF'},
  {color:'#FFD34D', textColor:'#26344B'},
  {color:'#3B6FD1', textColor:'#FFFFFF'},
  {color:'#3F8F4F', textColor:'#FFFFFF'},
  {color:'#C0453F', textColor:'#FFFFFF'},
  {color:'#B3312C', textColor:'#FFFFFF'},
  {color:'#5B6473', textColor:'#FFFFFF'}
];

// ---- storage helpers ----
// 3段階のフォールバック:
// 1) window.storage : Claudeアーティファクトとして開いている場合（アカウント紐付け・永続）
// 2) localStorage    : ダウンロードして単体のHTMLとしてブラウザで開いた場合（端末に永続）
// 3) メモリ上の変数   : 上記どちらも使えない場合の最終手段（タブを閉じると消える）
const LS_PREFIX = 'kyozai-ledger:';
const memFallback = {};
let storageOK = !!(window.storage && window.storage.get && window.storage.set);
let localOK = false;
try{
  const testKey = LS_PREFIX + '__test__';
  localStorage.setItem(testKey, '1');
  localStorage.removeItem(testKey);
  localOK = true;
}catch(e){ localOK = false; }

async function storeGet(key){
  if(ARCHIVE_MODE){
    const v = ARCHIVE_DATA.records ? ARCHIVE_DATA.records[key] : undefined;
    return v !== undefined ? v : null;
  }
  if(storageOK){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ /* fall through */ }
  }
  if(localOK){
    try{
      const v = localStorage.getItem(LS_PREFIX + key);
      return v ? JSON.parse(v) : null;
    }catch(e){ /* fall through */ }
  }
  return memFallback[key] || null;
}
async function storeSet(key, value){
  if(ARCHIVE_MODE) return; // 閲覧専用アーカイブでは一切保存しない
  if(storageOK){
    try{
      await window.storage.set(key, JSON.stringify(value), false);
      if(key.indexOf('rec:')===0 || key.indexOf('memo:')===0) RECORDED_KEYS.add(key);
      return;
    }
    catch(e){ /* fall through */ }
  }
  if(localOK){
    try{
      localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
      if(key.indexOf('rec:')===0 || key.indexOf('memo:')===0) RECORDED_KEYS.add(key);
      return;
    }catch(e){ /* fall through (e.g. quota exceeded) */ }
  }
  memFallback[key] = value;
  if(key.indexOf('rec:')===0 || key.indexOf('memo:')===0) RECORDED_KEYS.add(key);
}
async function storeDelete(key){
  if(ARCHIVE_MODE) return;
  if(storageOK){
    try{ await window.storage.delete(key, false); RECORDED_KEYS.delete(key); return; }
    catch(e){ /* ignore missing key */ }
  }
  if(localOK){
    try{ localStorage.removeItem(LS_PREFIX + key); RECORDED_KEYS.delete(key); return; }
    catch(e){ /* fall through */ }
  }
  delete memFallback[key];
  RECORDED_KEYS.delete(key);
}

// ---- build page list: schools x (grade1..6 + memo) ----
const PAGES = [];
const PAGES_PER_SCHOOL = 7;
function pagesForSchool(si){
  const arr = [];
  for(let g=1; g<=6; g++) arr.push({schoolIdx:si, kind:'grade', grade:g});
  arr.push({schoolIdx:si, kind:'memo'});
  return arr;
}
function rebuildPages(){
  PAGES.length = 0;
  SCHOOLS.forEach((s, si)=>{ PAGES.push(...pagesForSchool(si)); });
}
rebuildPages();

let currentIndex = 0;
let currentData = null; // cached record for the on-screen page
let saveTimer = null;
let YEAR_LABELS = {r6:'R6', r7:'R7'};

const pageTrack = document.getElementById('pageTrack');
const schoolNameEl = document.getElementById('schoolName');
const pageKindEl = document.getElementById('pageKind');
const telInputEl = document.getElementById('telInput');
const faxInputEl = document.getElementById('faxInput');
const tabRail = document.getElementById('tabRail');
const dotsEl = document.getElementById('dots');
const topbarEl = document.getElementById('topbar');

// topbarの実際の高さに合わせて、一番上のタブがtopbarの下に来るよう調整する
function syncTabRailOffset(){
  if(!topbarEl || !tabRail) return;
  const banner = document.getElementById('archiveBanner');
  const bannerH = (banner && banner.offsetParent !== null) ? banner.offsetHeight : 0;
  tabRail.style.paddingTop = (topbarEl.offsetHeight + bannerH) + 'px';
}
syncTabRailOffset();
window.addEventListener('resize', syncTabRailOffset);
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(syncTabRailOffset).catch(()=>{});
}

// ---------------- RECORDED-DATA TRACKING (for badges) ----------------
const RECORDED_KEYS = new Set();
async function loadRecordedKeys(){
  if(ARCHIVE_MODE){
    Object.keys(ARCHIVE_DATA.records || {}).forEach(k=>{
      if(k.indexOf('rec:')===0 || k.indexOf('memo:')===0) RECORDED_KEYS.add(k);
    });
    return;
  }
  if(storageOK){
    try{
      const recRes = await window.storage.list('rec:', false);
      const memoRes = await window.storage.list('memo:', false);
      (recRes && recRes.keys || []).forEach(k=> RECORDED_KEYS.add(k));
      (memoRes && memoRes.keys || []).forEach(k=> RECORDED_KEYS.add(k));
      return;
    }catch(e){ /* fall through */ }
  }
  if(localOK){
    try{
      for(let i=0; i<localStorage.length; i++){
        const lk = localStorage.key(i);
        if(!lk || lk.indexOf(LS_PREFIX) !== 0) continue;
        const k = lk.slice(LS_PREFIX.length);
        if(k.indexOf('rec:')===0 || k.indexOf('memo:')===0) RECORDED_KEYS.add(k);
      }
      return;
    }catch(e){ /* fall through */ }
  }
  Object.keys(memFallback).forEach(k=>{
    if(k.indexOf('rec:')===0 || k.indexOf('memo:')===0) RECORDED_KEYS.add(k);
  });
}
function schoolHasData(s){
  for(let g=1; g<=6; g++) if(RECORDED_KEYS.has(`rec:${s.id}:${g}`)) return true;
  return RECORDED_KEYS.has(`memo:${s.id}`);
}

function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('confirmOverlay');
    document.getElementById('confirmMessage').textContent = message;
    overlay.classList.add('open');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    function cleanup(result){
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onBackdrop);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    function onBackdrop(e){ if(e.target === overlay) cleanup(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onBackdrop);
  });
}

async function deleteCurrentSchool(){
  if(ARCHIVE_MODE || PAGES.length === 0) return;
  const si = PAGES[currentIndex].schoolIdx;
  const s = SCHOOLS[si];

  if(!ok) return;

  clearTimeout(saveTimer);
  for(let g=1; g<=6; g++) await storeDelete(`rec:${s.id}:${g}`);
  await storeDelete(`memo:${s.id}`);

  SCHOOLS.splice(si, 1);
  rebuildPages();
  await storeSet('schools', SCHOOLS);
  buildTabRail();

  if(PAGES.length === 0){
    renderEmptyState();

  showToast('学校を削除しました');
}

// ---------------- ARCHIVE EXPORT ----------------
// 現在の全学校・全学年・メモのデータを1つのJSONにまとめ、それを
// このページ自身のHTML（document.documentElement.outerHTML）に埋め込んだ
// 「閲覧専用アーカイブ」ファイルを生成してダウンロードさせる。
async function collectFullSnapshot(){
  const records = {};
  records['schools'] = SCHOOLS;
  records['yearLabels'] = YEAR_LABELS;
  for(const s of SCHOOLS){
    for(let g=1; g<=6; g++){
      const v = await storeGet(`rec:${s.id}:${g}`);
      if(v) records[`rec:${s.id}:${g}`] = v;
    }
    const m = await storeGet(`memo:${s.id}`);
    if(m) records[`memo:${s.id}`] = m;
  }
  return records;
}

function isIOSDevice(){
  const ua = navigator.userAgent || '';
  const iOSLike = /iPad|iPhone|iPod/.test(ua);
  // iPadOS 13+ は Mac 風の User-Agent を返すため、タッチ対応で判定を補う
  const iPadOSMasquerade = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return iOSLike || iPadOSMasquerade;
}

function downloadTextFile(filename, content){
  // text/html などブラウザが「表示できる」MIMEタイプだと、保存の代わりにその場で
  // 開こうとするブラウザがある。application/octet-stream にして
  // 「未知のファイル＝ダウンロード対象」として扱わせるのが最も確実。
  const blob = new Blob([content], {type: 'application/octet-stream'});
  const url = URL.createObjectURL(blob);

  if(isIOSDevice()){
    // iOS Safariは window.open() 経由のダウンロードだとファイル名(拡張子)が
    // "Unknown" になってしまい保存後に開けなくなる。本物のユーザータップによる
    // <a download> クリックであればファイル名が正しく保持されるため、
    // ダイアログ内に実際にタップしてもらうリンクを表示する方式に切り替える。
    const link = document.getElementById('archiveDownloadLink');
    link.href = url;
    link.download = filename;
    link.textContent = `📥 ${filename} を保存`;
    document.getElementById('archiveStepInput').style.display = 'none';
    document.getElementById('archiveStepReady').style.display = 'block';
    return;
  }

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  closeArchiveDialog();
  showToast('書き出しました');
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

async function exportArchive(yearLabel){
  const records = await collectFullSnapshot();
  const snapshot = {
    yearLabelTag: yearLabel,
    exportedAt: new Date().toISOString(),
    records
  };
  const jsonStr = JSON.stringify(snapshot).replace(/</g, '\\u003c');

  let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  html = html.replace(
    /<script id="data-archive" type="application\/json">[\s\S]*?<\/script>/,
    `<script id="data-archive" type="application/json">${jsonStr}<\/script>`
  );
  html = html.replace(/<title>[\s\S]*?<\/title>/, `<title>教材受注台帳（${esc(yearLabel)}アーカイブ）</title>`);

  const safeName = yearLabel.replace(/[\\/:*?"<>|]/g, '') || '無題';
  downloadTextFile(`教材受注台帳（${safeName}アーカイブ）.html`, html);
}

function buildDots(){

function updateDots(){
  const p = PAGES[currentIndex];
  [...dotsEl.children].forEach((el, i)=>{
    const isMemo = i === 6;
    const on = (p.kind==='memo' && isMemo) || (p.kind==='grade' && !isMemo && p.grade === i+1);
    el.classList.toggle('active', on);

function recordKey(p){
  const s = SCHOOLS[p.schoolIdx];
  return p.kind==='grade' ? `rec:${s.id}:${p.grade}` : `memo:${s.id}`;
}

function defaultGradeData(){
  return { teacher:'', chips:{}, pairChips:{}, dates:{}, counts:{}, classCounts:Array(8).fill(''), sample:{s:false,d:false,c:false}, returns:[], visits:[] };
}
function defaultMemoData(){
  return { entries:[] };
}

// ---------------- RENDER ----------------
async function render(idx, direction){
  currentIndex = idx;
  const p = PAGES[idx];
  const school = SCHOOLS[p.schoolIdx];

  schoolNameEl.disabled = ARCHIVE_MODE;
  schoolNameEl.value = school.tab;
  pageKindEl.textContent = p.kind==='grade' ? `${['一','二','三','四','五','六'][p.grade-1]}年生` : '営業メモ';
  telInputEl.value = school.tel || '';
  faxInputEl.value = school.fax || '';
  telInputEl.disabled = ARCHIVE_MODE;
  faxInputEl.disabled = ARCHIVE_MODE;
  syncTabRailOffset();

  updateTabRail();
  buildDots();

  const key = recordKey(p);
  const stored = await storeGet(key);
  currentData = stored || (p.kind==='grade' ? defaultGradeData() : defaultMemoData());
  // guard against missing fields from older saves
  if(p.kind==='grade'){
    currentData = Object.assign(defaultGradeData(), currentData);
  } else {
    currentData = Object.assign(defaultMemoData(), currentData);
  }

  pageTrack.innerHTML = p.kind==='grade' ? renderGradePage(p) : renderMemoPage(p);
  pageTrack.scrollTop = 0;
  pageTrack.classList.remove('fade-enter');
  void pageTrack.offsetWidth;
  pageTrack.classList.add('fade-enter');

  wireEvents(p);
  storeSet('lastPage', idx);
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- SAVE TOAST ----------------
let toastTimer = null;
function showToast(message, opts){
  opts = opts || {};
  const el = document.getElementById('saveToast');
  el.innerHTML = `<span class="tick">✓</span><span>${esc(message)}</span>` +
    (opts.undo ? `<span class="undoLink" id="toastUndo">元に戻す</span>` : '');
  if(opts.undo){
    document.getElementById('toastUndo').addEventListener('click', ()=>{
      opts.undo();
      el.classList.remove('show');
      clearTimeout(toastTimer);
    });
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), opts.duration || (opts.undo ? 3200 : 1400));
}

function renderChip(token, key, on){
  return `<span class="chip ${on?'on':''}" data-chipkey="${esc(key)}"><span class="ring"></span>${esc(token)}</span>`;
}

function renderChipPair(tokens, base, yearKey){
  const k0 = `${base}-${yearKey}-0`;
  const k1 = `${base}-${yearKey}-1`;
  const pairKey = `${base}-${yearKey}`;
  const on0 = !!currentData.chips[k0];
  const on1 = !!currentData.chips[k1];
  const paired = !!currentData.pairChips[pairKey] && on0 && on1;
  return `<span class="chippair ${paired?'paired':''}" data-pairkey="${esc(pairKey)}">
    <span class="pairring"></span>
    <span class="chip ${(!paired && on0)?'on':''}" data-chipkey="${esc(k0)}"><span class="ring"></span>${esc(tokens[0])}</span>
    <span class="chip ${(!paired && on1)?'on':''}" data-chipkey="${esc(k1)}"><span class="ring"></span>${esc(tokens[1])}</span>
  </span>`;
}

function formatMD(iso){
  if(!iso) return '月/日';
  const parts = iso.split('-');
  if(parts.length !== 3) return '月/日';
  const m = parseInt(parts[1],10), d = parseInt(parts[2],10);
  if(!m || !d) return '月/日';
  return `${m}/${d}`;
}

function renderGradePage(p){
  const gm = GRADES[p.grade-1];
  let html = '';

  // --- subjects ---
  gm.sections.forEach((sec, si)=>{
    const teacherField = si===0 ? `<input type="text" class="teacherInput" data-teacherfield="1" placeholder="先生名" value="${esc(currentData.teacher||'')}">` : '';
    html += `<div class="section"><h2>${sec.title ? `<span class="eyebrow">${esc(sec.title)}</span>` : '<span class="eyebrow">教材</span>'} 発注状況${teacherField}</h2>`;
    sec.items.forEach((item, ii)=>{
      const base = `${si}-${ii}`;
      html += `<div class="item">
        <div class="item-top">
          <span class="item-name ${item.name?'':'empty'}">${item.name ? esc(item.name) : '（同上・追加分）'}</span>
          <span class="item-price">${item.price && typeof item.price==='number' ? '¥'+item.price : ''}</span>
        </div>`;
      if(item.solo){
        const k = `${base}-solo`;
        html += `<div class="chiprow">${renderChip(item.solo, k, !!currentData.chips[k])}</div>`;
      }
      if(item.r6 && item.r6.length){
        html += `<div class="chiprow"><input type="text" class="yearlabel-input" data-yearfield="r6" value="${esc(YEAR_LABELS.r6)}">`;
        if(item.r6.length === 2){
          html += renderChipPair(item.r6, base, 'r6');
        } else {
          item.r6.forEach((t,ti)=>{
            const k = `${base}-r6-${ti}`;
            html += renderChip(t, k, !!currentData.chips[k]);
          });
        }
        html += `</div>`;
      }
      if(item.r7 && item.r7.length){
        html += `<div class="chiprow"><input type="text" class="yearlabel-input" data-yearfield="r7" value="${esc(YEAR_LABELS.r7)}">`;
        if(item.r7.length === 2){
          html += renderChipPair(item.r7, base, 'r7');
        } else {
          item.r7.forEach((t,ti)=>{
            const k = `${base}-r7-${ti}`;
            html += renderChip(t, k, !!currentData.chips[k]);
          });
        }
        html += `</div>`;
      }
      const dateVal = currentData.dates[base] || '';
      const cVal = (currentData.counts[base]||{}).s || '';
      const tVal = (currentData.counts[base]||{}).t || '';
      html += `<div class="item-fields">
        <div class="field-mini"><label>受注日</label><div class="datebox">
          <input type="date" class="date-native" data-datekey="${base}" value="${esc(dateVal)}">
          <span class="date-label${dateVal ? '' : ' empty'}" data-datelabel="${base}">${esc(formatMD(dateVal))}</span>
        </div></div>
        <div class="field-mini"><label>児童用</label><div class="stepper">
          <button type="button" class="stepbtn" data-steptarget="cnt-${base}-s" data-stepdelta="-1">−</button>
          <input type="number" inputmode="numeric" min="0" id="cnt-${base}-s" data-countkey="${base}" data-countfield="s" value="${esc(cVal)}">
          <button type="button" class="stepbtn" data-steptarget="cnt-${base}-s" data-stepdelta="1">＋</button>
        </div></div>
        <div class="field-mini"><label>教師用</label><div class="stepper">
          <button type="button" class="stepbtn" data-steptarget="cnt-${base}-t" data-stepdelta="-1">−</button>
          <input type="number" inputmode="numeric" min="0" id="cnt-${base}-t" data-countkey="${base}" data-countfield="t" value="${esc(tVal)}">
          <button type="button" class="stepbtn" data-steptarget="cnt-${base}-t" data-stepdelta="1">＋</button>
        </div></div>
      </div>`;
      html += `</div>`;
    });
    html += `</div>`;
  });

  // --- class roster ---
  const total = currentData.classCounts.reduce((a,b)=> a + (parseInt(b)||0), 0);
  html += `<div class="section"><h2><span class="eyebrow">クラス</span> 在籍数</h2><div class="classgrid">`;
  for(let c=0;c<8;c++){
    html += `<div class="classcell"><span class="clabel">${c+1}組</span><div class="stepper">
      <button type="button" class="stepbtn" data-steptarget="cls-${c}" data-stepdelta="-1">−</button>
      <input type="number" inputmode="numeric" min="0" id="cls-${c}" data-classidx="${c}" value="${esc(currentData.classCounts[c])}">
      <button type="button" class="stepbtn" data-steptarget="cls-${c}" data-stepdelta="1">＋</button>
    </div></div>`;
  }
  html += `</div><div class="classtotal">在籍合計　<b id="classTotal">${total}</b> 名</div></div>`;

  // --- 見本配布回収 ---
  html += `<div class="section"><h2><span class="eyebrow">見本</span> 配布・回収</h2><div class="checkrow">
    <div class="checkbtn ${currentData.sample.s?'on':''}" data-sample="s">見本</div>
    <div class="checkbtn ${currentData.sample.d?'on':''}" data-sample="d">配布</div>
    <div class="checkbtn ${currentData.sample.c?'on':''}" data-sample="c">回収</div>
  </div></div>`;

  // --- returns / vendor table ---
  html += `<div class="section"><h2><span class="eyebrow">取次</span> 教科名・出版社</h2><div id="returnsList">`;
  html += renderReturns(currentData.returns);
  html += `</div><button class="addbtn" id="addReturn">＋ 行を追加</button></div>`;

  // --- visit memo within grade page ---
  html += `<div class="section"><h2><span class="eyebrow">記録</span> 営業内容</h2><div id="visitsList">`;
  html += renderVisits(currentData.visits);
  html += `</div><button class="addbtn" id="addVisit">＋ 記録を追加</button></div>`;

  return html;
}

// ---------------- EVENT WIRING ----------------
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    await storeSet(recordKey(PAGES[currentIndex]), currentData);
    showToast('保存しました');
    refreshBadges();
  }, 250);
}

function wireEvents(p){
  if(ARCHIVE_MODE){
    // 閲覧専用: 入力欄をすべて無効化し、編集系イベントは一切配線しない
    pageTrack.querySelectorAll('input, textarea, select, .stepbtn, .addbtn, .delrow').forEach(el=>{
      if('disabled' in el) el.disabled = true;
      else el.style.display = 'none';
    });
    return;
  }
  // stepper +/- buttons (works for both count fields and class roster)
  pageTrack.querySelectorAll('.stepbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = document.getElementById(btn.dataset.steptarget);
      if(!input) return;
      const next = Math.max(0, (parseInt(input.value)||0) + Number(btn.dataset.stepdelta));
      input.value = next;
      input.dispatchEvent(new Event('input', {bubbles:true}));
    });
  });
  // chips - 単独（年刊・色ノートなど）はタップのみでON/OFF
  pageTrack.querySelectorAll('.chiprow > [data-chipkey]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.chipkey;
      currentData.chips[k] = !currentData.chips[k];
      el.classList.toggle('on', currentData.chips[k]);
      scheduleSave();
    });
  });
  // chips - 上/下ペアはタップで個別ON/OFF、長押しでまとめて丸める判子に
  pageTrack.querySelectorAll('.chippair').forEach(pairEl=>{
    const chipEls = [...pairEl.querySelectorAll('[data-chipkey]')];
    if(chipEls.length !== 2) return;
    const [chip0, chip1] = chipEls;
    const key0 = chip0.dataset.chipkey;
    const key1 = chip1.dataset.chipkey;
    const pairKey = pairEl.dataset.pairkey;

    function applyPairState(){
      const paired = !!currentData.pairChips[pairKey] && !!currentData.chips[key0] && !!currentData.chips[key1];
      pairEl.classList.toggle('paired', paired);
      chip0.classList.toggle('on', !paired && !!currentData.chips[key0]);
      chip1.classList.toggle('on', !paired && !!currentData.chips[key1]);
    }
    function shortTap(chipKey){
      currentData.pairChips[pairKey] = false;
      currentData.chips[chipKey] = !currentData.chips[chipKey];
      applyPairState();
      scheduleSave();
    }
    function longPress(){
      const alreadyPaired = !!currentData.pairChips[pairKey] && !!currentData.chips[key0] && !!currentData.chips[key1];
      if(alreadyPaired){
        currentData.chips[key0] = false;
        currentData.chips[key1] = false;
        currentData.pairChips[pairKey] = false;
      } else {
        currentData.chips[key0] = true;
        currentData.chips[key1] = true;
        currentData.pairChips[pairKey] = true;
      }
      applyPairState();
      scheduleSave();
      if(navigator.vibrate) navigator.vibrate(12);
    }

    chipEls.forEach(chipEl=>{
      let pressTimer = null;
      let longFired = false;
      chipEl.addEventListener('pointerdown', ()=>{
        longFired = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(()=>{ longFired = true; longPress(); }, 480);
      });
      chipEl.addEventListener('pointerup', ()=>{
        clearTimeout(pressTimer);
        if(!longFired) shortTap(chipEl.dataset.chipkey);
      });
      chipEl.addEventListener('pointerleave', ()=> clearTimeout(pressTimer));
      chipEl.addEventListener('pointercancel', ()=> clearTimeout(pressTimer));
      chipEl.addEventListener('click', (e)=>{ e.preventDefault(); }, true);
    });
  });
  // editable 年度ラベル (R6 / R7) — shared across the whole ledger
  pageTrack.querySelectorAll('[data-yearfield]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const field = el.dataset.yearfield;
      const val = el.value.trim() || (field==='r6' ? 'R6' : 'R7');
      YEAR_LABELS[field] = val;
      pageTrack.querySelectorAll(`[data-yearfield="${field}"]`).forEach(x=> x.value = val);
      storeSet('yearLabels', YEAR_LABELS);
    });
  });

  if(p.kind==='grade'){
    // teacher name
    pageTrack.querySelectorAll('[data-teacherfield]').forEach(el=>{
      el.addEventListener('input', ()=>{
        currentData.teacher = el.value;
        scheduleSave();
      });
    });
    // dates
    pageTrack.querySelectorAll('[data-datekey]').forEach(el=>{
      el.addEventListener('change', ()=>{
        currentData.dates[el.dataset.datekey] = el.value;
        const label = pageTrack.querySelector(`[data-datelabel="${el.dataset.datekey}"]`);
        if(label){
          label.textContent = formatMD(el.value);
          label.classList.toggle('empty', !el.value);
        }
        scheduleSave();
      });
    });
    // counts
    pageTrack.querySelectorAll('[data-countkey]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const key = el.dataset.countkey, field = el.dataset.countfield;
        currentData.counts[key] = currentData.counts[key] || {};
        currentData.counts[key][field] = el.value;
        scheduleSave();
      });
    });
    // class roster
    pageTrack.querySelectorAll('[data-classidx]').forEach(el=>{
      el.addEventListener('input', ()=>{
        currentData.classCounts[Number(el.dataset.classidx)] = el.value;
        const total = currentData.classCounts.reduce((a,b)=> a + (parseInt(b)||0), 0);
        const totalEl = document.getElementById('classTotal');
        if(totalEl) totalEl.textContent = total;
        scheduleSave();
      });
    });
    // sample checkbuttons
    pageTrack.querySelectorAll('[data-sample]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const f = el.dataset.sample;
        currentData.sample[f] = !currentData.sample[f];
        el.classList.toggle('on', currentData.sample[f]);
        scheduleSave();
      });
    });
    // returns
    wireReturns();
    document.getElementById('addReturn').addEventListener('click', ()=>{
      currentData.returns.push({name:'',price:'',pub:'',vendor:''});
      document.getElementById('returnsList').innerHTML = renderReturns(currentData.returns);
      wireReturns();
      scheduleSave();
    });
    // visits
    wireVisits(currentData.visits);
    document.getElementById('addVisit').addEventListener('click', ()=>{
      currentData.visits.push({date:'',teacher:'',content:''});
      document.getElementById('visitsList').innerHTML = renderVisits(currentData.visits);
      wireVisits(currentData.visits);
      scheduleSave();
    });
  } else {
    wireVisits(currentData.entries);
    document.getElementById('addVisit').addEventListener('click', ()=>{
      currentData.entries.push({date:'',teacher:'',content:''});
      document.getElementById('visitsList').innerHTML = renderVisits(currentData.entries);
      wireVisits(currentData.entries);
      scheduleSave();
    });
  }
}

function wireReturns(){
  pageTrack.querySelectorAll('[data-rfield]').forEach(el=>{
    el.addEventListener('input', ()=>{
      currentData.returns[Number(el.dataset.ridx)][el.dataset.rfield] = el.value;
      scheduleSave();
    });
  });
  pageTrack.querySelectorAll('[data-delreturn]').forEach(el=>{
    el.addEventListener('click', ()=>{

      currentData.returns.splice(idx,1);

function wireVisits(arr){
  pageTrack.querySelectorAll('[data-vfield]').forEach(el=>{
    el.addEventListener('input', ()=>{
      arr[Number(el.dataset.vidx)][el.dataset.vfield] = el.value;
      scheduleSave();

  pageTrack.querySelectorAll('[data-delvisit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = Number(el.dataset.delvisit);
      const removed = arr[idx];
      arr.splice(idx,1);
      document.getElementById('visitsList').innerHTML = renderVisits(arr);
      wireVisits(arr);
      scheduleSave();
      showToast('記録を削除しました', {undo:()=>{
        arr.splice(idx,0,removed);
        document.getElementById('visitsList').innerHTML = renderVisits(arr);
        wireVisits(arr);
        scheduleSave();
      }});
    });
  });
}

// ---------------- NAVIGATION ----------------
function goTo(idx, animate){
  if(PAGES.length === 0) return;
  if(idx < 0) idx = 0;
  if(idx > PAGES.length-1) idx = PAGES.length-1;
  if(idx === currentIndex && !animate) return;
  render(idx);
}

document.getElementById('prevBtn').addEventListener('click', ()=> goTo(currentIndex-1, true));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(currentIndex+1, true));
document.addEventListener('keydown', (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return; // don't hijack cursor movement while typing
  if(e.key==='ArrowLeft') goTo(currentIndex-1, true);
  if(e.key==='ArrowRight') goTo(currentIndex+1, true);
  if(e.key==='Escape'){ closeSearch(); closeColorPicker(); closeArchiveDialog(); }
});

function renderSearchResults(query){
  const q = query.trim();
  const resultsEl = document.getElementById('searchResults');
  const filtered = SCHOOLS
    .map((s, si)=>({s, si}))
    .filter(({s})=> !q || s.tab.indexOf(q)!==-1 || s.name.indexOf(q)!==-1);
  if(!filtered.length){
    const msg = SCHOOLS.length===0 ? '学校がまだ登録されていません。タブ下の「＋」から追加してください。' : `「${esc(q)}」に一致する学校がありません`;
    resultsEl.innerHTML = `<div class="searchEmpty">${msg}</div>`;
    return;
  }
  resultsEl.innerHTML = filtered.map(({s, si})=>{
    const has = schoolHasData(s);
    return `<div class="searchResultRow" data-si="${si}">
      <span class="swatch" style="background:${esc(s.color||'#999')}"></span>
      <span class="srname">${esc(s.tab)}</span>
      ${has ? '<span class="srbadge">入力済</span>' : ''}
      ${ARCHIVE_MODE ? '' : `<button type="button" class="srColorBtn" data-si="${si}" aria-label="タブの色を変更">🎨</button>`}
    </div>`;
  }).join('');
  resultsEl.querySelectorAll('.srColorBtn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openColorPicker(Number(btn.dataset.si));
    });
  });
  resultsEl.querySelectorAll('.searchResultRow').forEach(row=>{
    row.addEventListener('click', ()=>{
      const si = Number(row.dataset.si);
      closeSearch();
      goTo(si * PAGES_PER_SCHOOL, true);
    });
  });
}

// 学年別シート(1年〜6年) + 全学年分の営業メモを1シートにまとめて集計する
async function buildOrderSummaryData(){
  const gradeRows = {1:[], 2:[], 3:[], 4:[], 5:[], 6:[]};
  const memoRows = [];

  for(const s of SCHOOLS){
    for(let g=1; g<=6; g++){
      const rec = await storeGet(`rec:${s.id}:${g}`);
      if(!rec) continue;
      const gm = GRADES[g-1];
      const teacherName = rec.teacher || '';

      gm.sections.forEach((sec, si)=>{
        sec.items.forEach((item, ii)=>{
          const base = `${si}-${ii}`;
          const cnt = (rec.counts && rec.counts[base]) || {};
          const sVal = parseInt(cnt.s, 10) || 0;
          const tVal = parseInt(cnt.t, 10) || 0;
          if(!sVal && !tVal) return;

          const picks = [];
          if(item.solo){
            if(rec.chips && rec.chips[`${base}-solo`]) picks.push(item.solo);
          }
          ['r6','r7'].forEach(yk=>{
            if(item[yk] && item[yk].length){
              const label = YEAR_LABELS[yk] || yk;
              const selTokens = item[yk].filter((t,ti)=> rec.chips && rec.chips[`${base}-${yk}-${ti}`]);
              if(selTokens.length) picks.push(`${label}:${selTokens.join('・')}`);
            }
          });

          const dateVal = (rec.dates && rec.dates[base]) || '';
          gradeRows[g].push([s.tab || s.name || '', teacherName, item.name, picks.join(' / '), dateVal, sVal, tVal]);
        });
      });

      (rec.visits || []).forEach(v=>{
        if(!v.date && !v.teacher && !v.content) return;
        memoRows.push([s.tab || s.name || '', `${g}年`, v.date || '', v.teacher || '', v.content || '']);
      });
    }

    const mem = await storeGet(`memo:${s.id}`);
    if(mem && Array.isArray(mem.entries)){
      mem.entries.forEach(en=>{
        if(!en.date && !en.teacher && !en.content) return;
        memoRows.push([s.tab || s.name || '', '全学年', en.date || '', en.teacher || '', en.content || '']);
      });
    }
  }

  for(let g=1; g<=6; g++){
    gradeRows[g].sort((a,b)=> a[0].localeCompare(b[0], 'ja') || a[2].localeCompare(b[2], 'ja'));
  }

  const hasAnyGrade = Object.values(gradeRows).some(r=> r.length > 0);
  if(!hasAnyGrade && memoRows.length === 0) return null;

  return { gradeRows, memoRows };
}

async function syncOrderSummaryToSheet(){
  const cfg = await getDriveConfig();
  if(!cfg){
    showToast('先にDrive連携設定を行ってください');
    openDriveConfigDialog(null);
    return;
  }
  showToast('集計を作成しています…');
  const data = await buildOrderSummaryData();
  if(!data){
    showToast('対象データがありません');
    return;
  }
  const { gradeRows, memoRows } = data;

  const sheets = [];
  for(let g=1; g<=6; g++){
    sheets.push({
      name: `${g}年`,
      rows: [
        ['学校名','先生名','教材名','採択','受注日','児童用','教師用'],
        ...gradeRows[g]
      ]
    });
  }
  sheets.push({
    name: 'メモ',
    rows: [
      ['学校名','学年','日付','先生名','内容'],
      ...memoRows
    ]
  });

  try{
    showToast('スプレッドシートへ送信しています…');
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: cfg.token, app: 'es', sheets })
    });
    const json = await res.json().catch(()=> null);
    if(json && json.ok){
      showToast('スプレッドシートに書き出しました');
    } else {
      showToast('書き出しに失敗しました' + (json && json.error ? (': ' + json.error) : ''));
    }
  }catch(err){
    showToast('書き出しに失敗しました(通信エラー)');
  }
}

// swipe
let touchStartX = null, touchStartY = null, touching=false;
const viewport = document.getElementById('viewport');
viewport.addEventListener('touchstart', (e)=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touching = true;
}, {passive:true});
viewport.addEventListener('touchend', (e)=>{
  if(!touching) return;
  touching = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.4){
    if(dx < 0) goTo(currentIndex+1, true); else goTo(currentIndex-1, true);
  }
}, {passive:true});

    savedSchools.forEach(s=> SCHOOLS.push(s));

  let startIdx = 0;

  render(startIdx);
}
